<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BP LAB 2026 - Generatore Sfondi WebGL</title>
  <link rel="stylesheet" href="css/typography.css">
  <style>
    :root {
      --admin-bg: #0b0d17;
      --admin-surface: #121424;
      --admin-border: rgba(255, 255, 255, 0.08);
      --admin-border-accent: rgba(123, 190, 188, 0.3);
      --admin-accent: #7bbebc;
      --admin-gold: #f2cd77;
      --admin-text: #e2e8f0;
      --admin-text-muted: #94a3b8;
      --admin-font: 'ABC Camera', sans-serif;
      --admin-transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--admin-bg);
      color: var(--admin-text);
      font-family: var(--admin-font);
      display: flex;
      height: 100vh;
      overflow: hidden;
      background: radial-gradient(at 0% 0%, rgba(76, 77, 155, 0.08) 0px, transparent 50%),
                  radial-gradient(at 100% 100%, rgba(123, 190, 188, 0.08) 0px, transparent 50%),
                  #0b0d17;
    }

    /* Main Area: Preview Canvas */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
    }

    .canvas-container {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--admin-border);
      border-radius: 8px;
      padding: 12px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.5);
      max-height: 80vh;
      aspect-ratio: 540/675;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    canvas {
      max-width: 100%;
      max-height: 100%;
      height: auto;
      object-fit: contain;
    }

    /* Sidebar Controls */
    aside {
      width: 320px;
      background: var(--admin-surface);
      border-left: 1px solid var(--admin-border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      box-shadow: -8px 0 24px rgba(0,0,0,0.3);
    }

    header {
      padding: 20px;
      border-bottom: 1px solid var(--admin-border);
    }

    header h1 {
      font-family: 'Tuaf', sans-serif;
      font-size: 18px;
      color: var(--admin-gold);
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    header p {
      font-size: 11px;
      color: var(--admin-text-muted);
      margin-top: 4px;
    }

    .controls-body {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--admin-text-muted);
      display: flex;
      justify-content: space-between;
    }

    .field label .val {
      color: var(--admin-accent);
      font-weight: 700;
    }

    /* Sliders and Range inputs */
    input[type="range"] {
      -webkit-appearance: none;
      background: transparent;
      width: 100%;
      height: 24px;
    }
    input[type="range"]:focus { outline: none; }
    input[type="range"]::-webkit-slider-runnable-track {
      width: 100%;
      height: 4px;
      background: rgba(255,255,255,0.08);
      border-radius: 10px;
    }
    input[type="range"]::-webkit-slider-thumb {
      height: 12px;
      width: 12px;
      border-radius: 50%;
      background: var(--admin-gold);
      cursor: pointer;
      -webkit-appearance: none;
      margin-top: -4px;
      transition: transform 0.1s;
    }
    input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.2);
    }

    /* Toggle switches */
    .toggle-wrapper {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255,255,255,0.02);
    }
    .toggle-wrapper label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--admin-text-muted);
    }

    .toggle {
      position: relative;
      display: inline-block;
      width: 32px;
      height: 18px;
    }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .slider-switch {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: rgba(255,255,255,0.1);
      transition: .2s;
      border-radius: 18px;
    }
    .slider-switch:before {
      position: absolute;
      content: "";
      height: 12px; width: 12px;
      left: 3px; bottom: 3px;
      background-color: var(--admin-text);
      transition: .2s;
      border-radius: 50%;
    }
    input:checked + .slider-switch {
      background-color: var(--admin-accent);
    }
    input:checked + .slider-switch:before {
      transform: translateX(14px);
      background-color: #000;
    }

    /* Select element */
    .admin-select {
      width: 100%;
      padding: 8px 12px;
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid var(--admin-border);
      border-radius: 6px;
      color: var(--admin-text);
      font-size: 11px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s;
    }
    .admin-select:focus {
      border-color: var(--admin-accent);
    }

    /* Swatches */
    .color-swatch-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }
    .color-swatch {
      width: 24px;
      height: 24px;
      border-radius: 4px;
      border: 2px solid rgba(255,255,255,0.1);
      cursor: pointer;
      transition: all 0.15s ease;
      flex-shrink: 0;
    }
    .color-swatch:hover {
      transform: scale(1.15);
      border-color: rgba(255,255,255,0.3);
    }
    .color-swatch.active {
      border-color: var(--admin-accent);
      box-shadow: 0 0 6px rgba(123, 190, 188, 0.5);
    }

    /* Buttons */
    .btn-row {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 20px;
      border-top: 1px solid var(--admin-border);
    }

    .admin-btn {
      width: 100%;
      padding: 10px 16px;
      background: transparent;
      border: 1px solid var(--admin-border);
      border-radius: 6px;
      color: var(--admin-text);
      font-family: inherit;
      font-size: 11px;
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all var(--admin-transition);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .admin-btn:hover {
      border-color: var(--admin-border-accent);
      background: rgba(255, 255, 255, 0.02);
    }

    .admin-btn.primary {
      background: var(--admin-accent);
      border-color: var(--admin-accent);
      color: #000;
    }
    .admin-btn.primary:hover {
      background: #89cfcd;
    }

    .admin-btn.gold {
      background: var(--admin-gold);
      border-color: var(--admin-gold);
      color: #000;
    }
    .admin-btn.gold:hover {
      background: #f4d48d;
    }

    .status-badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .status-badge.online {
      background: rgba(123, 190, 188, 0.15);
      color: var(--admin-accent);
    }
    .status-badge.offline {
      background: rgba(239, 68, 68, 0.15);
      color: #ef4444;
    }
    
    .back-btn {
      position: absolute;
      top: 20px;
      left: 20px;
      background: rgba(18, 20, 36, 0.6);
      border: 1px solid var(--admin-border);
      padding: 6px 14px;
      border-radius: 6px;
      color: var(--admin-text-muted);
      text-decoration: none;
      font-size: 11px;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s;
    }
    .back-btn:hover {
      color: var(--admin-text);
      border-color: var(--admin-border-accent);
      background: rgba(18, 20, 36, 0.9);
    }
  </style>
</head>
<body>

  <main>
    <a href="admin.html" class="back-btn">&larr; Torna all'Admin Panel</a>
    <div class="canvas-container">
      <canvas id="webglCanvas"></canvas>
    </div>
  </main>

  <aside>
    <header>
      <h1>Generatore Sfondi</h1>
      <p>Genera grafiche geometriche SVG procedurali per le copertine o le pagine dei drink</p>
    </header>

    <div class="controls-body">
      <div id="webglStatus" class="status-badge offline">&#x23F3; Checking...</div>

      <div class="field">
        <label>Palette <span class="val">(Clicca per attivare/disattivare)</span></label>
        <div class="color-swatch-grid" id="webglPaletteSwatches"></div>
      </div>

      <div class="field" style="margin-top: -6px;">
        <div style="display:flex;gap:6px;align-items:center;">
          <input type="color" id="addPaletteColorPicker" value="#7bbebc" style="border:1px solid var(--admin-border);background:transparent;border-radius:4px;width:36px;height:26px;cursor:pointer;padding:0;">
          <button class="admin-btn" id="btnAddPaletteColor" style="padding:4px 8px;font-size:9px;width:auto;flex:1;height:26px;">+ Aggiungi Colore</button>
        </div>
      </div>

      <div class="field">
        <label>Colonne per riga <span class="val" id="valWebglPerRow">4</span></label>
        <input type="range" id="webglPerRow" min="1" max="15" step="1" value="4">
      </div>

      <div class="field">
        <label>Margine X (mm) <span class="val" id="valWebglMarginX">0</span></label>
        <input type="range" id="webglMarginX" min="0" max="200" step="1" value="0">
      </div>

      <div class="field">
        <label>Margine Y (mm) <span class="val" id="valWebglMarginY">0</span></label>
        <input type="range" id="webglMarginY" min="0" max="200" step="1" value="0">
      </div>

      <div class="field">
        <label>Spazio colonna GX <span class="val" id="valWebglGapX">0</span></label>
        <input type="range" id="webglGapX" min="0" max="100" step="1" value="0">
      </div>

      <div class="field">
        <label>Spazio riga GY <span class="val" id="valWebglGapY">0</span></label>
        <input type="range" id="webglGapY" min="0" max="100" step="1" value="0">
      </div>

      <div class="toggle-wrapper">
        <label>Usa piastrelle grandi</label>
        <label class="toggle">
          <input type="checkbox" id="webglBigTiles" checked>
          <span class="slider-switch"></span>
        </label>
      </div>

      <div class="field">
        <label>Probabilità piastrella grande <span class="val" id="valWebglBigTileProb">0.30</span></label>
        <input type="range" id="webglBigTileProb" min="0" max="1" step="0.05" value="0.30">
      </div>

      <div class="field">
        <label>Dimensione piastrella grande</label>
        <select class="admin-select" id="webglBigTileMode">
          <option value="auto">Auto (Misto)</option>
          <option value="2x1">Orizzontale 2&times;1</option>
          <option value="1x2">Verticale 1&times;2</option>
          <option value="2x2" selected>Quadrata 2&times;2</option>
        </select>
      </div>

      <div class="toggle-wrapper">
        <label>Accoppia piastrelle (Usa a coppie)</label>
        <label class="toggle">
          <input type="checkbox" id="webglUsePairs">
          <span class="slider-switch"></span>
        </label>
      </div>
    </div>

    <div class="btn-row">
      <button class="admin-btn primary" id="btnWebglGenerate">GENERA NUOVO</button>
      <button class="admin-btn gold" id="btnDownloadSVG">SCARICA FILE SVG</button>
      <button class="admin-btn" id="btnDownloadPNG" style="border-color:var(--admin-border-accent);">SCARICA FILE PNG</button>
    </div>
  </aside>

  <script src="js/admin-webgl.js"></script>
  <script>
    (function() {
      'use strict';
      var webgl = window.AdminWebGL;
      var defaultColors = ['#121420', '#F2CD77', '#7BBEBC', '#e0e0e0', '#a0a0a0', '#c66845', '#939c69', '#e3bfd7'];

      // Try to load palette from localstorage
      function getColors() {
        try {
          var saved = localStorage.getItem('bp_lab_menu_state_v2');
          if (saved) {
            var parsed = JSON.parse(saved);
            if (parsed && parsed.palette) {
              var p = parsed.palette;
              var keys = ['bg', 'h1Color', 'h2Color', 'h3Color', 'bodyColor', 'captionColor'];
              var colors = [];
              for (var i = 0; i < keys.length; i++) {
                if (p[keys[i]]) colors.push(p[keys[i]]);
              }
              var extra = p.extra || [];
              for (var j = 0; j < extra.length; j++) {
                colors.push(extra[j]);
              }
              if (colors.length > 0) return colors;
            }
          }
        } catch(e) {}
        return defaultColors;
      }

      // Add a new color to localStorage state
      function addColorToLocalStorage(color) {
        try {
          var saved = localStorage.getItem('bp_lab_menu_state_v2');
          var stateObj = saved ? JSON.parse(saved) : {};
          if (!stateObj.palette) stateObj.palette = {};
          if (!stateObj.palette.extra) stateObj.palette.extra = [];
          
          // Avoid duplicates
          if (stateObj.palette.extra.indexOf(color) === -1) {
            stateObj.palette.extra.push(color);
            localStorage.setItem('bp_lab_menu_state_v2', JSON.stringify(stateObj));
          }
        } catch(e) {
          console.warn('Failed to save added color to localStorage:', e);
        }
      }

      // Initialize Swatches
      function initSwatches() {
        var container = document.getElementById('webglPaletteSwatches');
        if (!container) return;
        container.innerHTML = '';
        var colors = getColors();

        // Save palette globally so admin-webgl can read it
        window.AdminState = {
          getPaletteColors: function() {
            return colors;
          }
        };

        colors.forEach(function(c, idx) {
          var activeClass = (idx < 6) ? ' active' : '';
          var el = document.createElement('div');
          el.className = 'color-swatch' + activeClass;
          el.style.background = c;
          el.setAttribute('data-idx', idx);
          el.addEventListener('click', function() {
            el.classList.toggle('active');
            livePreview();
          });
          container.appendChild(el);
        });
      }

      // Live Preview updating
      var liveTimer = null;
      function livePreview() {
        clearTimeout(liveTimer);
        liveTimer = setTimeout(function() {
          if (webgl) {
            webgl.generateLive(webgl.getConfig());
          }
        }, 80);
      }

      // Bind events
      function bindEvents() {
        var ranges = ['webglPerRow', 'webglMarginX', 'webglMarginY', 'webglGapX', 'webglGapY', 'webglBigTileProb'];
        ranges.forEach(function(id) {
          var el = document.getElementById(id);
          var valEl = document.getElementById('val' + id.charAt(0).toUpperCase() + id.slice(1));
          if (el) {
            el.addEventListener('input', function() {
              if (valEl) valEl.textContent = el.value;
              livePreview();
            });
          }
        });

        var changeElements = ['webglBigTiles', 'webglBigTileMode', 'webglUsePairs'];
        changeElements.forEach(function(id) {
          var el = document.getElementById(id);
          if (el) {
            el.addEventListener('change', livePreview);
          }
        });

        // Add new color binding
        var btnAddColor = document.getElementById('btnAddPaletteColor');
        var picker = document.getElementById('addPaletteColorPicker');
        if (btnAddColor && picker) {
          btnAddColor.addEventListener('click', function() {
            var color = picker.value;
            addColorToLocalStorage(color);
            initSwatches();
            livePreview();
          });
        }

        // API indicator check
        if (webgl) {
          webgl.isApiAvailable().then(function(ok) {
            var badge = document.getElementById('webglStatus');
            if (badge) {
              badge.className = 'status-badge ' + (ok ? 'online' : 'offline');
              badge.innerHTML = ok ? '&#x2705; API Online' : '&#x26A0;&#xFE0F; Offline (canvas fallback)';
            }
          });
        }

        // Generate button click
        var btnGenerate = document.getElementById('btnWebglGenerate');
        if (btnGenerate) {
          btnGenerate.addEventListener('click', function() {
            livePreview();
          });
        }

        // Download SVG button
        var btnDownload = document.getElementById('btnDownloadSVG');
        if (btnDownload) {
          btnDownload.addEventListener('click', function() {
            if (!webgl) return;
            var cfg = webgl.getConfig();
            var svgStr = webgl.generate(cfg);
            if (svgStr) {
              var blob = new Blob([svgStr], { type: 'image/svg+xml;charset=utf-8' });
              var a = document.createElement('a');
              a.href = URL.createObjectURL(blob);
              a.download = 'sfondo_' + Date.now() + '.svg';
              document.body.appendChild(a);
              a.click();
              document.body.removeChild(a);
              URL.revokeObjectURL(a.href);
            }
          });
        }

        // Download PNG button
        var btnDownloadPNG = document.getElementById('btnDownloadPNG');
        if (btnDownloadPNG) {
          btnDownloadPNG.addEventListener('click', function() {
            var canvasEl = document.getElementById('webglCanvas');
            if (canvasEl) {
              try {
                var dataUrl = canvasEl.toDataURL('image/png');
                var a = document.createElement('a');
                a.href = dataUrl;
                a.download = 'sfondo_' + Date.now() + '.png';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
              } catch(err) {
                alert('Errore nella generazione del PNG: ' + err.message);
              }
            }
          });
        }
      }

      document.addEventListener('DOMContentLoaded', function() {
        initSwatches();
        bindEvents();
        if (webgl) {
          webgl.init('webglCanvas');
          // Wait 300ms for SVGs to load and trigger initial draw
          setTimeout(function() {
            livePreview();
          }, 300);
        }
      });
    })();
  </script>
</body>
</html>
